[project]
name = "mini-headway-backend"
version = "0.1.0"
description = "Mini-Headway interview backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0,<2.1",
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "mypy>=1.10", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-q"

[tool.mypy]
python_version         = "3.11"
strict_optional        = true
warn_unused_ignores    = true
ignore_missing_imports = true
exclude                = ["tests/"]

[tool.ruff]
line-length    = 100
target-version = "py311"
